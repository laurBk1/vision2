[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# ── Headere de securitate (SINGURA sursă: nu mai există public/_headers) ────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com https://www.google.com https://stats.g.doubleclick.net https://*.clarity.ms https://c.bing.com https://res.cloudinary.com; media-src 'self' blob: https://res.cloudinary.com; connect-src 'self' https://formsubmit.co https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.googletagmanager.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://*.clarity.ms https://c.bing.com https://res.cloudinary.com; frame-src 'self' https://www.google.com https://maps.google.com; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"

# HTML: mereu revalidat (conținut proaspăt după deploy)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Fișierele text pentru crawleri: tip corect + nu se indexează ca pagini
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/ai.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

# ── Redirecturi canonice (host unic: https://visionedit.ro) ─────────────────────
[[redirects]]
  from = "http://visionedit.ro/*"
  to = "https://visionedit.ro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.visionedit.ro/*"
  to = "https://visionedit.ro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.visionedit.ro/*"
  to = "https://visionedit.ro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://celebrated-lebkuchen-782bc0.netlify.app/*"
  to = "https://visionedit.ro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://celebrated-lebkuchen-782bc0.netlify.app/*"
  to = "https://visionedit.ro/:splat"
  status = 301
  force = true

# ── NU mai există fallback SPA "/* -> /index.html 200" ──────────────────────────
# Fiecare rută are propriul dist/<ruta>/index.html prerenderat. URL-urile inexistente
# primesc un 404 REAL (dist/404.html), nu un "soft 404" cu status 200.
